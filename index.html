<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Consumo de Energia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="btn-tema">🌙 Modo Escuro</button>
    <main class="calculadora-container">
        <h1>Calculadora de Consumo de Energia</h1>
        <div class="grupo-input">
            <label for="potencia">Potência do equipamento (W):</label>
            <input type="number" id="potencia" placeholder="Ex: 1000" min="1">
        </div>
        <div class="grupo-input">
            <label for="horas">Horas de utilização por dia (Máx 24):</label>
            <input type="number" id="horas" placeholder="Ex: 2" min="1" max="24">
        </div>
        <div class="grupo-input">
            <label for="dias">Dias de utilização no mês (Máx 31):</label>
            <input type="number" id="dias" placeholder="Ex: 30" min="1" max="31">
        </div>
        <div class="grupo-botoes">
            <button id="btn-calcular">CALCULAR</button>
            <button id="btn-limpar">LIMPAR</button>
        </div>
        <div id="area-resultado" class="escondido">
            <p id="texto-consumo"></p>
            <p id="texto-classificacao"></p>
        </div>
        <div id="area-erro" class="escondido">
            <p id="mensagem-erro">Preencha corretamente: Horas (1 - 24) e Dias (1 -31).</p>
        </div>
    </main>

</body>
    <script src="script.js"></script>
</html>
